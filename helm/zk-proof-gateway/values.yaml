# Default values for zk-proof-gateway.

gateway:
  image:
    repository: zkgw-gateway
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 8752
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  audit:
    persistence:
      # The audit log is the non-repudiation trail -- an emptyDir loses
      # every entry on pod restart/reschedule, which quietly breaks that
      # guarantee. Enabled by default; set false only for throwaway
      # clusters (e.g. a quick kind smoke test) where losing history is
      # fine and no default StorageClass may be provisioned.
      enabled: true
      size: 1Gi
      storageClassName: ""   # "" = cluster default StorageClass

prover:
  image:
    repository: zkgw-prover
    tag: local
    pullPolicy: IfNotPresent
  port: 8753
  # DEMO ONLY: the value the prover proves about. Production reads from a
  # real OMS/position-service adapter behind read_source_value()
  # (python/prover_service.py) / readSourceValue() (go/proverservice) --
  # never set a real notional here.
  #
  # MUST be a quoted string, not a bare YAML integer: Helm decodes
  # values.yaml through a YAML->JSON->interface{} pipeline, and encoding/json
  # always decodes numbers into float64 for interface{} targets. A bare
  # 735000000 here renders as "7.35e+08" in the template, which the prover
  # then fails to parse as an integer.
  sourceValue: "735000000"
  agentId: exec-agent-07
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  # Placeholder container standing in for the real source-of-truth service
  # (OMS/position service) this pod is co-located with, per the paper's
  # topology A (source-side prover). Swap for your actual source workload's
  # image; the prover only needs network-local access to it, not a specific
  # image.
  sourcePlaceholder:
    image:
      repository: busybox
      tag: "1.36"

# Registry contents: the signed predicate file(s) and the governance public
# key, mounted read-only into the gateway from a ConfigMap. Populate with
# `governance_cli.py define`'s output and `governance_cli.py keygen`'s
# public key -- generated OUTSIDE the cluster, the private key never touches
# this values file or the chart.
registry:
  governancePub: ""   # contents of governance.pub (hex, one line)
  predicates: {}        # map: filename -> full contents of a signed predicate JSON file
    # example:
    # pretrade_notional_cap.v1.json: |
    #   {"predicate": {...}, "signature": {...}}

networkPolicy:
  enabled: true
